[project]
name = "assumption-propagation"
version = "0.1.0"
description = "Explicit inferential assumption propagation in multi-agent LLM systems"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.117,<1",
    "pydantic>=2.7",
    "networkx>=3.3",
    "openai>=1.40",
    "tenacity>=8.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assumption_propagation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# tests/ imports the CLI entry points from scripts/, which is a directory of
# runnable scripts rather than an installed package.
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
